# Integración continua: en cada push y pull request, GitHub instala Quillay en
# Windows, macOS y Linux, revisa el estilo del código (ruff) y corre los tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"   # la versión mínima soportada
    env:
      QT_QPA_PLATFORM: offscreen   # Qt sin pantalla
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Librerías de sistema para Qt (solo Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar Quillay con extras de desarrollo
        run: python -m pip install -e ".[gui,dev]"

      - name: Revisar estilo (ruff)
        run: ruff check src tests scripts

      - name: Tests
        run: python -m pytest -v
