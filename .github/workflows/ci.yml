# Integración continua: en cada push y pull request, GitHub instala Quillay en
# Windows, macOS y Linux, revisa el estilo del código (ruff) y corre los tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# El CI solo lee el repositorio: aunque un pull request trajera código malicioso,
# el token de GitHub no le permitiría cambiar nada.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu fijo (no «latest»): así la CI no cambia sola cuando GitHub migra a una versión nueva.
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.11"   # la versión mínima soportada
          - os: ubuntu-24.04
            python: "3.14"   # la más nueva (la que instala Homebrew en macOS)
    env:
      QT_QPA_PLATFORM: offscreen   # Qt sin pantalla
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml  # sin esto, setup-python busca requirements.txt y se detiene

      - name: Librerías de sistema para Qt (solo Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Permitir el sandbox de Chrome (solo Linux)
        # Ubuntu 24.04+ bloquea los "user namespaces" que usa el sandbox de Chrome;
        # sin esto, Chrome no arranca en la maquina de GitHub y falla la prueba de HTML a PDF.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Instalar Quillay con extras de desarrollo
        run: python -m pip install -e ".[gui,dev]"

      - name: Revisar estilo (ruff)
        run: ruff check src tests scripts

      - name: Tests
        run: python -m pytest -v

  workflows:
    # actionlint revisa los workflows con las mismas reglas que GitHub
    # (por ejemplo, que en las condiciones solo se usen comillas simples).
    name: Revisar workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Descargar actionlint 1.7.7
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Revisar
        run: ./actionlint -color
