# Dependabot revisa cada semana si hay versiones nuevas de las librerías
# y de las acciones de GitHub, y abre un pull request para actualizarlas.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
